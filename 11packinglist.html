<!DOCTYPE html>
<html>
<head>
<title>Lismount Tex Packing List</title>

<style>
body{font-family:Arial;margin:40px;}
.header{text-align:center;}
.logo{width:80px;}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

table,th,td{
border:1px solid black;
}

th,td{
padding:6px;
text-align:center;
}

input{
width:95%;
border:none;
text-align:center;
}

button{
padding:8px 15px;
margin-top:10px;
}

</style>

<script>

function addRow(){

var table=document.getElementById("table");
var row=table.insertRow();

row.innerHTML=`
<td>${table.rows.length-1}</td>
<td><input></td>
<td><input></td>
<td><input class="meter" onkeyup="total()"></td>
<td><input></td>
`;

}

function total(){

var meters=document.querySelectorAll(".meter");
var sum=0;

meters.forEach(function(m){
sum+=Number(m.value);
});

document.getElementById("total").value=sum;

}

</script>

</head>

<body>

<div class="header">

<h2>LISMOUNT TEX INDIA LLP</h2>
<h3>Packing List / Delivery Challan</h3>

</div>

Order No : <input><br><br>
Party Name : <input><br><br>
Delivery No : <input><br><br>
Date : <input type="date">

<table id="table">

<tr>
<th>S.No</th>
<th>Bale No</th>
<th>Pieces</th>
<th>Meters</th>
<th>Weight</th>
</tr>

<tr>
<td>1</td>
<td><input></td>
<td><input></td>
<td><input class="meter" onkeyup="total()"></td>
<td><input></td>
</tr>

</table>

<button onclick="addRow()">Add Row</button>

<br><br>

Total Meter : <input id="total" readonly>

<br><br>

<button onclick="window.print()">Print</button>

</body>
</html>
